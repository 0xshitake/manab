name: Build & Release APK

on:
  push:
    branches: [master]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --split-per-abi --target-platform android-arm64

      # Always upload APK as build artifact (downloadable from Actions tab).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: manab-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # Only create a GitHub Release when a tag is pushed.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
